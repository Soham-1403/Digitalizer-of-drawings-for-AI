[project]
name = "digitalizer-of-drawings"
version = "0.1.0"
description = "Digitize scanned/PDF structural drawings into layered, editable CAD data with a deterministic + LLM-vision hybrid pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
    "PySide6>=6.6",
    "PyMuPDF>=1.23",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "scikit-image>=0.22",
    "shapely>=2.0",
    "ezdxf>=1.1",
    "pytesseract>=0.3.10",
    "Pillow>=10.2",
    "reportlab>=4.1",
    "anthropic>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
digitalizer = "app.main:main"
digitalizer-cli = "engine.pipeline:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
